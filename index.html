<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    서브 경로(GitHub Pages의 /family-day/ 등)에 올릴 때는
    `flutter build web --base-href "/family-day/"` 로 빌드하면 이 값이 채워집니다.
  -->
  <base href="/family-day/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="가족 일정과 초등 숙제 미션을 한곳에서 관리하는 Family Day. 알림장을 붙여넣으면 숙제·일정·시간표로 자동 분류해요.">
  <meta name="theme-color" content="#0D1B33">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS: 홈 화면에 추가(PWA) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Family Day">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>Family Day</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0D1B33;
    }
    #boot {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", "Noto Sans KR", sans-serif;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      letter-spacing: 0.2px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="boot">Family Day 준비 중…</div>
  <script>
    // 앱이 화면을 그린 뒤에는 첫 로딩 안내를 지운다.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <noscript>Family Day를 보려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</body>
</html>
